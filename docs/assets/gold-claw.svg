<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="OpenClaw gold claw logo">
  <defs>
    <!-- Main gold gradient -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FFF176"/>
      <stop offset="30%"  stop-color="#F9A825"/>
      <stop offset="65%"  stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#7B5800"/>
    </linearGradient>
    <!-- Lighter gold for upper-face shine -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Subtle dark edge at bottom -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── CLAW SILHOUETTE ─────────────────────────────────────────────────── -->
  <!--
    Orientation: claw opens to the LEFT; handle exits to the RIGHT.
    Three pieces drawn as a single compound path:
      1. Upper jaw (dactyl)  – long finger curving upper-left
      2. Palm / knuckle      – rounded hub connecting both jaws to handle
      3. Lower jaw (pollex)  – shorter finger curving lower-left
      4. Handle / wrist      – thick cylinder on the right
  -->

  <!-- ─── Body: palm + handle ─── -->
  <path filter="url(#glow)"
        d="M 155,72
           C 165,66 190,62 215,65
           C 228,67 235,76 234,87
           C 233,98 224,106 210,108
           C 190,111 165,107 155,101
           C 148,97 145,90 148,83
           C 150,77 152,74 155,72 Z"
        fill="url(#gold)" stroke="#8B6914" stroke-width="1.2"/>

  <!-- ─── Upper jaw (dactyl) ─── -->
  <path filter="url(#glow)"
        d="M 155,77
           C 138,72 112,62  82,48
           C 55,35  28,22   10,14
           C  3,11   2,17    6,22
           C 11,28  32,37   58,50
           C 88,64 114,74  145,84
           L 155,84
           Z"
        fill="url(#gold)" stroke="#8B6914" stroke-width="1.2"/>

  <!-- ─── Lower jaw (pollex) ─── -->
  <path filter="url(#glow)"
        d="M 155,96
           C 138,102 113,113  86,126
           C 62,138  36,149  18,157
           C 10,160  9,155  13,151
           C 18,145  40,136  65,124
           C 95,110 122,99  150,94
           L 155,94
           Z"
        fill="url(#gold)" stroke="#8B6914" stroke-width="1.2"/>

  <!-- ─── Shine overlay (top-face gloss) ─── -->
  <path d="M 155,72
           C 165,66 190,62 215,65
           C 228,67 235,76 234,87
           C 233,98 224,106 210,108
           C 190,111 165,107 155,101
           C 148,97 145,90 148,83
           C 150,77 152,74 155,72 Z"
        fill="url(#shine)"/>
  <path d="M 155,77
           C 138,72 112,62  82,48
           C 55,35  28,22   10,14
           C  3,11   2,17    6,22
           C 11,28  32,37   58,50
           C 88,64 114,74  145,84
           L 155,84 Z"
        fill="url(#shine)"/>

  <!-- ─── Dark edge on lower jaw ─── -->
  <path d="M 155,96
           C 138,102 113,113  86,126
           C 62,138  36,149  18,157
           C 10,160  9,155  13,151
           C 18,145  40,136  65,124
           C 95,110 122,99  150,94 L 155,94 Z"
        fill="url(#edge)"/>

  <!-- ─── Highlight streak on handle ─── -->
  <path d="M 165,67 C 188,64 218,66 228,70 C 215,68 185,66 165,69 Z"
        fill="#FFF9C4" opacity="0.55"/>

  <!-- ─── Sharp claw tips (gold triangles) ─── -->
  <!-- Upper tip -->
  <polygon points="6,18  14,10  16,26" fill="#FFE566" opacity="0.9"/>
  <!-- Lower tip -->
  <polygon points="10,154  18,147  20,163" fill="#FFE566" opacity="0.9"/>
</svg>
